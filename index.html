<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <img class="hero" src="/assets/hero.avif" alt="">
    <nav>
        <div class="nav">
            <ul>
                <img class="logo" src="/assets/logo.png" alt="">
                <li><a href=""></a>home</li>
                <li><a href=""></a>about</li>
                <li><a href=""></a>contact</li>
                <li><a href=""></a>services</li>
                <li><a href=""></a>projects</li>
            </ul>
        </div>
    </nav>
    <div class="hero1">
        <div class="hero-text">Welcome</div>
        <span>to our componay </span>
        <p>worlds best skincare and makeup products are avalable </p>
        <p> we ship grobally across the world with 4 days</p>
        <p> dilvery
            garurinty</p>
        <button class="btn">Get started</button>
        <section class="contact-section" id="contact">
            <h2 class="contact-title">Get in touch</h2>
            <p class="contact-sub">Have a question or want to work together? Drop a message.</p>

            <form id="contactForm" class="contact-form" novalidate>
                <input type="text" name="name" placeholder="Your name" required>
                <input type="email" name="email" placeholder="Your email" required>
                <textarea name="message" placeholder="Your message" rows="5" required></textarea>
                <button class="btn" type="submit">Send message</button>
            </form>

            <p id="formStatus" class="form-status"></p>
        </section>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const status = document.getElementById('formStatus');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            status.textContent = 'Sending…';
            status.className = 'form-status';

            // Gather form data
            const data = Object.fromEntries(new FormData(form));

            try {
                // Send to backend
                const res = await fetch('/api/contacts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    status.textContent = '✅ Thanks! Your message was sent.';
                    status.classList.add('success');
                    form.reset();
                } else {
                    status.textContent = '❌ ' + (result.error || 'Something went wrong');
                    status.classList.add('error');
                }
            } catch (err) {
                status.textContent = '❌ Network error. Please try again.';
                status.classList.add('error');
                console.error(err);
            }
        });
    </script>
</body>

</html>

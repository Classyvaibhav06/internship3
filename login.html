<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Simple centered layout for the login box */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f4f4f4;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        .login-box h2 {
            font-family: monospace;
            margin-bottom: 20px;
            color: #212121;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: monospace;
            box-sizing: border-box;
            /* Ensures padding doesn't break width */
            outline: none;
        }

        .login-box input:focus {
            border-color: #212121;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <input type="password" id="password" placeholder="Enter admin password" required>
            <button class="btn" type="submit" style="width: 100%;">Login</button>
        </form>
        <p id="errorMsg" style="color: #c0392b; font-family: monospace; margin-top: 15px; font-size: 0.9rem;"></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop page from reloading

            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // Clear previous error
            errorMsg.textContent = 'Logging in...';
            errorMsg.style.color = '#555';

            try {
                // Send password to the backend
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    // If login works, redirect to admin page
                    window.location.href = '/admin.html';
                } else {
                    // If it fails, show error
                    const data = await res.json();
                    errorMsg.textContent = data.error || 'Incorrect password!';
                    errorMsg.style.color = '#c0392b';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Is the server running?';
                errorMsg.style.color = '#c0392b';
            }
        });
    </script>

</body>

</html>
